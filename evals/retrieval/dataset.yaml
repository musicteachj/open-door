    question: how many rest breaks do I get
    must_not: [CO-3.3]
  - id: neg-final-mateo
    asker: mateo
    question: when do I get my last paycheck if I quit
    must_not: [CA-3.4, CO-3.4]
  - id: neg-final-dana
    asker: dana
    question: when do I get my final check
    must_not: [CA-3.4, TX-3.4]
  - id: neg-leave-mateo
    asker: mateo
    question: I need 12 weeks off for my mom's surgery
    must_not: [CA-5.1, CO-5.1]
  - id: neg-jury-priya
    asker: priya
    question: I got a jury summons
    must_not: [TX-4.5]
  - id: neg-sick-ga-hourly
    asker: { state: GA, employment_type: hourly, location: atl }
    question: how many sick days do I get
    must_not: [CA-4.3, CO-4.3]
  - id: neg-ot-ga-hourly
    asker: { state: GA, employment_type: hourly, location: atl }
    question: do I get overtime after 8 hours in a day
    must_not: [CA-3.2, CO-3.2]
  - id: neg-jury-ga-salaried
    asker: { state: GA, employment_type: salaried, location: atl }
    question: I got a jury summons
    must_not: [TX-4.5]
  - id: neg-vote-priya
