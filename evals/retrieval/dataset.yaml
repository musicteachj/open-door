    must_not: [CA-4.3]

  # Negatives: sections for another state or another employment type must never come back
  - id: neg-sick-mateo
    asker: mateo
    question: how many sick days do I get
    must_not: [CA-4.3, CO-4.3]
  - id: neg-sick-priya
