  - id: qa-45
    asker: mateo
    kind: other_state
    location_code: den
    question: do the denver people get more rest breaks than us
    reference: Colorado hourly employees get a paid 10-minute rest period for each 4 hours of work, with the number depending on shift length, such as 2 for a shift over 6 and up to 10 hours. This is the Colorado policy, not the Texas one.
    expect: ["CO-3.3"]
  - id: qa-46
    asker: mateo
    kind: other_state
    location_code: oak
    question: if you miss lunch in california do you get paid extra for it
    reference: In California, if a meal period is not provided you are owed one additional hour of pay at your regular rate for that workday. That is the California policy, not the Texas one.
    expect: ["CA-3.3"]

