  - id: qa-44
    asker: dana
    kind: other_state
    location_code: atl
    question: how does voting time work in atlanta, same as here?
    reference: In Georgia you can take up to 2 hours off to vote in each primary or election, whatever your schedule, and Juniper Row pays for it. This is the Georgia policy, which differs from the 3-hour test in the company section.
