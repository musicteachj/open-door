    reference: Make sure the person gets medical help first, and call 911 in an emergency. The injury is then reported to the manager and HR the same day if possible, so HR can help with next steps and any time they need away from work.
    expect: ["6.1"]
  - id: qa-38
    asker: marcus
    kind: answerable
    question: whats the eap and does my boss find out if i use it
    reference: The EAP offers free, confidential short-term counseling, up to 6 sessions per issue each year. Juniper Row never learns who uses it.
    expect: ["6.2"]
  - id: qa-39
    asker: dana
    kind: answerable
    question: can i get a copy of everything hr has on me
    reference: Yes. Ask HR in Open Door or by email, and HR sends you the information it holds about you, such as your job details, pay, and time off.
    expect: ["7.1"]
  - id: qa-40
    asker: priya
    kind: answerable
    question: if i open a case with hr how long til someone answers? kind of anxious about it
    reference: HR replies to a case within 2 business days. If your concern involves immediate danger, call 911 first and do not wait for a reply.
    expect: ["7.2", "2.3"]

