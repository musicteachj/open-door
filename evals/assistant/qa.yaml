# The assistant's Q&A set: questions as employees type them, with a reference answer.
#
# Each item has:
#   id         qa-NN, unique across this file and redteam.yaml
#   asker      a persona: priya and marcus (salaried, Oakland), dana (HR administrator, salaried,
#              Denver), or mateo (hourly, Austin)
#   kind       answerable | unanswerable | other_state | employment_decision | ai_identity |
#              tool_answer (the answer is a figure from a time-off tool, so it needs no handbook
#              citation; the reference quotes the engine's labels for the fixed sandbox on
#              Thursday, October 15, 2026, including Priya's two requests the harness adds)
#   question   the words, as the person would type them
#   reference  one or two sentences, true to the handbook (what a good answer says)
#   expect     section IDs that genuinely answer it; empty for unanswerable questions and for
#              the decision and identity questions. At least one cited section must be in the list.
#   location_code  (other_state only) the office the person asks about
#
# Deterministic checks (evals/assistant/graders.py): every cited section applies to the asker (or
# to the office asked about), a cited section is one of `expect`, and an unanswerable question gets
# no citation, "I couldn't find that in the handbook", and an offer of HR. The judge reads the rest.
#
# Written from the handbook text before any prompt tuning. The questions do not change to raise a
# score. Unanswerable questions were checked against every section: the handbook says nothing on
# parking, working from home, a 401(k), a dental plan, an employee discount, trading shifts, stock,
# pets, tuition, or smoking.

questions:
  # --- 1 Welcome ---
  - id: qa-01
    asker: mateo
    kind: answerable
    question: wait am i hourly or salaried? where do i even look that up
    reference: Your offer letter and your profile in Open Door say which one you are. Hourly employees are paid for every hour worked and get overtime where the rules cover it.
    expect: ["1.2"]
  - id: qa-02
    asker: priya
    kind: answerable
    question: do salaried people get overtime? asking bc i stay late a lot
    reference: No. Juniper Row classifies salaried roles as exempt from overtime, so the overtime rules apply only to hourly employees.
    expect: ["1.2"]
  - id: qa-03
    asker: dana
    kind: answerable
    question: does the handbook cover the atlanta store too or just us in denver
    reference: It covers everyone at Juniper Row, about 145 people across Denver, Oakland, Austin, and Atlanta. Some sections apply only to hourly staff or to certain states.
    expect: ["1.1"]

  # --- 2 Working here ---
  - id: qa-04
    asker: mateo
    kind: answerable
    question: can i go to hr about my lead without telling him first
    reference: Yes. You can take a concern straight to HR and are never required to start with your manager.
    expect: ["2.3", "2.2"]
  - id: qa-05
    asker: priya
    kind: answerable
    question: can my manager see what i send hr in open door
    reference: No. Only the HR team sees a confidential case. Managers never see one, including your own manager.
    expect: ["7.2"]
  - id: qa-06
    asker: marcus
    kind: answerable
    question: one of my guys came to me upset about a coworker. am i supposed to look into it myself?
    reference: No. A manager who hears a concern passes it to HR and does not investigate or decide the outcome. Tell the employee that HR will follow up.
    expect: ["2.3"]
  - id: qa-07
    asker: dana
    kind: answerable
    question: what counts as harassment here, are jokes about someones age included
    reference: Harassment is unwelcome behavior tied to a protected characteristic, such as age, that makes work hostile or intimidating. Slurs, jokes, or nicknames about who a person is are examples.
    expect: ["2.2"]
  - id: qa-08
    asker: mateo
    kind: answerable
    question: can i do deliveries on the weekends for another company or is that not allowed
    reference: Tell HR if you have an outside job or business that could affect your judgment at work. Telling HR early lets them find a simple fix.
    expect: ["2.4"]

  # --- 3 Hours and pay ---
  - id: qa-09
    asker: marcus
    kind: answerable
    question: what does hr actually keep on me in my employee record? just job stuff or more than that
    reference: Juniper Row keeps your work contact details, your job and location, your manager, your employment type, your pay, and your time off, including requests, balances, and approvals. It uses them to run payroll, schedule work, manage time off, and meet its duties as an employer.
    expect: ["7.1"]
  - id: qa-10
    asker: mateo
    kind: answerable
    question: if i work 45 hours one week do i get paid extra for the last 5
    reference: Yes. Hourly employees are paid overtime at time and one-half their regular rate for hours over 40 in a workweek, and the workweek runs Sunday through Saturday.
    expect: ["3.2"]
  - id: qa-11
    asker: mateo
    kind: answerable
    question: i had a paid holiday this week, does that count toward my 40 hours for overtime or nah
    reference: No. Under Juniper Row's policy, paid time off and holidays are paid but do not count as hours worked for overtime.
    expect: ["3.2"]
  - id: qa-12
    asker: mateo
    kind: answerable
    question: how long is lunch and am i paid for it
    reference: Hourly employees get an unpaid, uninterrupted 30-minute meal break on shifts over 5 hours, and you clock out for it. Rest breaks of 10 minutes for every 4 hours are paid.
    expect: ["3.3"]
  - id: qa-13
    asker: dana
    kind: answerable
    question: is payday every week or what
    reference: Juniper Row pays every other Friday, which is biweekly. Each payday covers the two workweeks that ended on the Saturday before it.
    expect: ["3.4"]
  - id: qa-14
    asker: priya
    kind: answerable
    question: im giving my notice at the end of the month. when do i get my last paycheck and does my leftover pto get paid
    reference: In California, if you give at least 72 hours' notice and leave on the day you named, all your wages are due on your last day. Your final pay includes any unused PTO.
    expect: ["CA-3.4", "3.4"]
  - id: qa-15
    asker: dana
    kind: answerable
    question: say i resign next month, when does the last check land and does the leftover pto get paid
    reference: In Colorado, if you resign your final wages are due on the next regular payday, and they include all your unused PTO.
    expect: ["CO-3.4", "3.4"]
  - id: qa-16
    asker: mateo
    kind: answerable
    question: if i got laid off how many days until they have to pay me
    reference: In Texas, if you are laid off or otherwise involuntarily separated, your final pay is due within 6 calendar days, or sooner if the next regular payday comes first.
    expect: ["TX-3.4"]

  # --- 4 Time off ---
  - id: qa-17
    asker: mateo
    kind: answerable
    question: im at like 140 hours of pto, is something going to happen to it
    reference: Hourly PTO can grow to a ceiling of 144 hours. At the ceiling you stop earning until you use some, but nothing you have already earned is ever taken away.
    expect: ["4.1"]
  - id: qa-18
    asker: priya
    kind: answerable
    question: does my pto disappear if i dont use it by december
    reference: No. Unused PTO carries into the next year and there is no use-it-or-lose-it deadline. The ceiling only pauses new earning, at 180 hours for salaried employees.
    expect: ["4.1"]
  - id: qa-19
    asker: mateo
    kind: answerable
    question: do hourly people get paid for holidays or is it just a free day off
    reference: Hourly employees receive 8 hours of holiday pay at their regular hourly rate for each company holiday their location is closed.
    expect: ["4.2"]
  - id: qa-20
    asker: dana
    kind: answerable
    question: how many holidays is the company closed, and is MLK day one of them
    reference: There are six company holidays, New Year's Day, Memorial Day, Independence Day, Labor Day, Thanksgiving, and Christmas Day. Martin Luther King Jr. Day is not one of them, though Denver HQ also closes the day after Thanksgiving.
    expect: ["4.2"]
  - id: qa-21
    asker: priya
    kind: answerable
    question: how many sick days do i get a year, and does it roll over
    reference: In California you get at least 40 hours, or 5 of your workdays if that is more, all on January 1. Unused hours do not carry over, because the new amount replaces them.
    expect: ["CA-4.3", "4.3"]
  - id: qa-22
    asker: mateo
    kind: answerable
    question: how many sick days do i get a year, and does it roll over
    reference: You get 40 hours (5 days) of paid sick leave each year, all on January 1. Unused hours do not carry over, because a new 40 hours replaces what is left.
    expect: ["4.3"]
  - id: qa-23
    asker: dana
    kind: answerable
    question: can i use sick time to take my kid to the dentist
    reference: Yes. In Colorado sick leave covers preventive care and medical care for you or a family member, and you have 48 hours available on January 1.
    expect: ["CO-4.3"]
  - id: qa-24
    asker: priya
    kind: answerable
    question: do i need a doctors note if im out sick for a whole week
    reference: No. Juniper Row does not ask for a doctor's note to use sick leave in California. Tell your manager as soon as practical.
    expect: ["CA-4.3"]
  - id: qa-25
    asker: mateo
    kind: answerable
    question: i was out sick 4 days in a row, will hr make me bring a note
    reference: You do not need a note for up to three consecutive scheduled days. For a longer absence HR may ask for a note confirming you needed to be away, and it does not need to describe your condition.
    expect: ["4.3"]
  - id: qa-26
    asker: marcus
    kind: answerable
    question: my wife has surgery thursday and i need to be home a few days. do i use pto or sick days
    reference: Sick leave can cover caring for a family member who needs care, which includes a spouse, and it is separate from PTO so using it does not reduce your PTO.
    expect: ["CA-4.3", "4.3"]
  - id: qa-27
    asker: mateo
    kind: answerable
    question: my uncle died, how many days do i get and do i get paid
    reference: You receive 2 paid days for the death of another relative such as an uncle, and hourly employees are paid for their scheduled hours on those days.
    expect: ["4.4"]
  - id: qa-28
    asker: dana
    kind: answerable
    question: i got a jury summons, who do i tell and do i still get paid
    reference: Bring your summons to your manager as soon as you get it and say when you are scheduled to serve. You are paid your full regular pay for up to 10 working days of jury service a year.
    expect: ["4.5"]
  - id: qa-29
    asker: marcus
    kind: answerable
    question: election day is tuesday and i work 7 to 7. can i get time to vote
    reference: If you do not have at least 3 consecutive hours outside your working hours while the polls are open, you can take up to 2 hours of paid time off to vote. Ask your manager before Election Day.
    expect: ["4.5"]

  # --- 5 Leaves of absence ---
  - id: qa-30
    asker: dana
    kind: answerable
    question: i might need a few months off for a health thing. can i keep my job and does my insurance stop
    reference: Juniper Row offers up to 12 weeks of unpaid, job-protected leave after 12 months and 1,250 hours worked, and your health coverage continues. Colorado's FAMLI program can also pay part of your wages for up to 12 weeks.
    expect: ["5.1", "CO-5.1"]
  - id: qa-31
    asker: priya
    kind: answerable
    question: my moms surgery is next tuesday, do i get time off for that?
    reference: You can use sick leave to care for a parent, and it does not reduce your PTO. For longer, California's CFRA allows up to 12 weeks of unpaid, job-protected leave if you have worked over 12 months and 1,250 hours.
    expect: ["CA-4.3", "CA-5.1", "4.3", "5.1"]
  - id: qa-32
    asker: marcus
    kind: answerable
    question: we are adopting this spring. does the 6 weeks of paid leave cover us too and can i split it up
    reference: Yes. Any parent gets 6 weeks of fully paid leave after an adoption once they have 6 months of employment. You can take it in shorter blocks within 12 months if you agree on a plan with your manager and HR.
    expect: ["5.2"]
  - id: qa-33
    asker: mateo
    kind: answerable
    question: ive only been here 4 months, can i still get parental leave when the baby comes
    reference: Paid parental leave starts after 6 months of employment, so at 4 months you do not qualify yet.
    expect: ["5.2"]
  - id: qa-34
    asker: priya
    kind: answerable
    question: what can you even ask for as an accommodation, is it just for disabilities
    reference: Reasonable accommodations are available for disability, pregnancy-related conditions, and sincerely held religious beliefs and practices. Examples include a different schedule, a stool or other equipment, and time off for medical appointments.
    expect: ["5.3"]
  - id: qa-35
    asker: priya
    kind: answerable
    question: going back to work in two weeks and still pumping. do those breaks come out of my pto
    reference: No. Lactation breaks are paid at your regular rate and you never have to use PTO or sick leave for them. Your manager and HR work with you on a private space and a schedule.
    expect: ["5.4", "CA-5.4"]
  - id: qa-36
    asker: dana
    kind: answerable
    question: is there a cutoff for pumping breaks, like when the baby turns one
    reference: No. The protection covers you for as long as you are nursing, whatever your child's age, and the breaks are paid.
    expect: ["5.4"]

  # --- 6 Health, safety, and support; 7 Privacy ---
