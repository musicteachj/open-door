- id: hg-21
  asker: Dana Whitfield, salaried, works at the Denver HQ in Denver, CO
  location_asked:
  question: |-
    i might need a few months off for a health thing. can i keep my job and does my insurance stop
  reference: |-
    Juniper Row offers up to 12 weeks of unpaid, job-protected leave after 12 months and 1,250 hours worked, and your health coverage continues. Colorado's FAMLI program can also pay part of your wages for up to 12 weeks.
  answer: |-
    I'm sorry you're dealing with this. Here's what the handbook says for Denver employees.

    **Keeping your job**
    - **Company leave:** You can take up to 12 weeks of unpaid, job-protected leave in a 12-month period if you have worked at Juniper Row for 12 months and for 1,250 hours in the 12 months before the leave begins.[1] You can use it for your own serious health condition[2].
    - **Colorado addendum:** If you have been employed at Juniper Row for at least 180 calendar days before your leave starts, you return to your job or an equivalent position with equivalent pay and benefits.[3] When the reason qualifies for both, FAMLI leave and Juniper Row's own leave in §5.1 Family and medical leave run at the same time.[4]

    **Your insurance**
    Your health coverage continues during leave on the same terms as when you were working.[5]

    **Pay**
    Leave under this section is unpaid, but you may use PTO or sick leave to be paid during it.[5]

    I can't tell you whether you qualify or how long your leave would last, because that depends on your dates. HR can confirm both.

    **Privacy**
    You can open a confidential case. You can open one in Open Door, and you do not have to tell your manager first.[6] Only the HR team sees a case. Managers never see a case, including your own manager. Coworkers do not see it either. HR shares details only with the people who must be involved to look into the matter, and tells you first if that is needed.[7] Also, medical information, accommodation requests, and confidential cases are held separately and shared only with the people who need them.[8]

    **Next step:** Talk to the HR team. They can check whether you're eligible, explain how this leave and FAMLI work together, and help you plan your dates. Their contact details are below.
