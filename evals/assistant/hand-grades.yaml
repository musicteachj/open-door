  location_asked:
  question: |-
    if i open a case with hr how long til someone answers? kind of anxious about it
  reference: |-
    HR replies to a case within 2 business days. If your concern involves immediate danger, call 911 first and do not wait for a reply.
  answer: |-
    It makes sense to feel anxious about this. According to the handbook, HR replies to a case within 2 business days. A reply may be an answer, a question, or a time to talk.[1]

    Some other things that may help:
    - **Who can see your case:** Only the HR team sees a case. Managers never see a case, including your own manager. Coworkers do not see it either.[2] HR shares details only with the people who must be involved to look into the matter, and tells you first if that is needed.[2]
    - **Who decides:** I'm an AI. If you open a case, I would send HR a short, neutral summary of what you wrote, with no recommendation about what HR should do.[3] People make every decision.[3]
    - **If it's urgent:** If your concern involves immediate danger, call 911 first, and do not wait for a reply.[1]

    If you want to go ahead, you can tell me what's going on in your own words, and I'll make sure it reaches HR. You don't have to share more than you're comfortable with.
