- id: hg-02
  asker: Mateo Alvarez, hourly, works at the Austin warehouse in Austin, TX
  location_asked:
  question: how many sick days do i get a year, and does it roll over
  reference: |-
    You get 40 hours (5 days) of paid sick leave each year, all on January 1. Unused hours do not carry over, because a new 40 hours replaces what is left.
  answer: |-
    The handbook says Juniper Row gives every employee 40 hours (5 days) of paid sick leave each year. This is the company rule for any state that has no sick leave law of its own, which today includes Texas[1], so it covers you in Austin.

    - **When you get it:** The 40 hours are front-loaded, which means you receive them all at once on January 1 each year.[2]
    - **Roll over:** It doesn't roll over. Unused sick hours do not carry over into the next year. On January 1, a new 40 hours replace what is left. Unused sick hours are not paid out when your employment ends.[3]
    - **PTO:** Sick leave is separate from paid time off, so using it never reduces your PTO.[1]

    If you need more time than that, you may be able to use PTO, or take a leave of absence.[4] I can't tell you how many hours you have left right now. HR or your manager can check that for you.
