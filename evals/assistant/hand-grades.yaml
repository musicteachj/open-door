- id: hg-10
  asker: Mateo Alvarez, hourly, works at the Austin warehouse in Austin, TX
  location_asked:
  question: my uncle died, how many days do i get and do i get paid
  reference: |-
    You receive 2 paid days for the death of another relative such as an uncle, and hourly employees are paid for their scheduled hours on those days.
  answer: |-
    I'm sorry about your uncle, Mateo.

    **How many days:** You receive 2 paid days for the death of another relative, such as an aunt, uncle, cousin, niece, or nephew[1]. The days do not need to be consecutive, and you can use them within three months of the death.[2] That means you can save one for a service that happens later.

    **Pay:** Yes, the days are paid. Hourly employees are paid for their scheduled hours on each bereavement day. If you were not scheduled to work on a day, that day does not count against your bereavement leave.[3] Bereavement leave is separate from PTO and sick leave, so using it does not reduce either.[4]

    **If you need more time:** You can use PTO or sick leave where it applies.[5] If you'd like to talk with someone, the Employee Assistance Program is free and confidential.[5]

    **Next steps:** I can't schedule the days for you. Talk to your manager or the HR team to set them up. Anything you share with HR is handled privately and only shared with people who need it to arrange your leave. HR's contact details are below. You also get 3 extra paid days if you have to travel for the funeral.
