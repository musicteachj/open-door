- id: hg-30
  asker: Priya Raman, salaried, works at the Oakland store in Oakland, CA
  location_asked:
  question: how many sick days do i get a year, and does it roll over
  reference: |-
    In California you get at least 40 hours, or 5 of your workdays if that is more, all on January 1. Unused hours do not carry over, because the new amount replaces them.
  answer: |-
    Since you work in Oakland, the California addendum applies to you instead of the general company rule.

    **How much you get:** In California you receive at least 40 hours, or 5 of your workdays, of paid sick leave each year, whichever is more. You receive all of it on January 1.[1] Sick leave is separate from paid time off, so using it never reduces your PTO.[2]

    **Rollover:** No. Because you receive the full amount at the start of each year, unused hours do not carry over. The new amount replaces them. Unused sick leave is not paid out when your employment ends.[3] One exception: if you are rehired within 12 months, your unused sick leave is restored.[3]

    I can't tell you how many sick hours you have left. HR or your manager can tell you that.
