- id: hg-05
  asker: Priya Raman, salaried, works at the Oakland store in Oakland, CA
  location_asked:
  question: can i trade days with a coworker if we both agree on it
  reference: |-
    The handbook does not cover swapping shifts or days. The assistant should say it could not find that and offer HR.
  answer: |-
    I couldn't find a rule in the handbook about trading days with a coworker, so I can't say whether an agreement between the two of you is enough.

    The closest thing it says is that your manager sets your schedule and shares it in advance.[1] That suggests your manager would need to be involved in any change.

    Before you and your coworker switch, ask your manager whether the trade is okay. If you want the official policy, you can ask the HR team. Their contact details are in the company directory.
  passages:
    - marker: 1
      section: '3.1'
      title: Schedules and timekeeping
      cited_text: |-
