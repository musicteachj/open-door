- id: hg-11
  asker: Mateo Alvarez, hourly, works at the Austin warehouse in Austin, TX
  location_asked: the Oakland store in Oakland, CA
  question: |-
    my buddy in oakland says they get overtime after 8 hours in a day, is that true out there
  reference: |-
    In California, hourly employees are paid time and one-half for hours over 8 in a workday, up to 12, and double time over 12. This is the California rule, not the Texas one that applies to you.
  answer: |-
    Yes, your buddy is right about Oakland. Here's what the California addendum, which covers the Oakland office, says. California counts overtime by the day as well as by the week.[1] Hourly employees there get time and a half for all hours over 8 in a workday, up to and including 12 hours; all hours over 40 in a workweek; the first 8 hours worked on the seventh consecutive day of work in a workweek[2]. They get double pay for all hours over 12 in a workday[3] and for all hours over 8 on the seventh consecutive day of work in a workweek[3].

    That daily rule doesn't apply to you in Austin. The company section pays overtime for hours over 40 in a workweek.[4] The handbook says that only California and Colorado have daily overtime rules that can give you more than the federal rule.[5] In Texas, overtime is based on going over 40 hours in a week.

    If you have questions about your own hours or pay, your manager or the HR team can help.
