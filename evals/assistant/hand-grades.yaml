- id: hg-22
  asker: Mateo Alvarez, hourly, works at the Austin warehouse in Austin, TX
  location_asked:
  question: my uncle died, how many days do i get and do i get paid
  reference: |-
    You receive 2 paid days for the death of another relative such as an uncle, and hourly employees are paid for their scheduled hours on those days.
  answer: |-
    I'm sorry about your uncle.

    **How many days:** For an uncle, the handbook says you receive 2 paid days for the death of another relative, such as an aunt, uncle, cousin, niece, or nephew[1].

    **Pay:** Yes, the days are paid. Hourly employees are paid for their scheduled hours on each bereavement day. If you were not scheduled to work on a day, that day does not count against your bereavement leave.[2] Also, bereavement leave is separate from PTO and sick leave, so using it does not reduce either.[3]

    **What to do next:**
    - Tell your manager as soon as you can, and record the days in Open Door.[4]
    - You don't have to share much. You do not need to give details, and HR may ask only for the date of the death and your relationship to the person.[4]
    - If you need more time than bereavement leave gives you, you can use PTO or sick leave where it applies.[5]
    - If you'd like someone to talk to, the Employee Assistance Program is free and confidential.[5]

    I can't tell you exactly which days will be covered or how much you'll be paid. Your manager or the HR team can go over that with you, and their contact details are below.
  passages:
    - marker: 1
      section: '4.4'
      title: Bereavement leave
