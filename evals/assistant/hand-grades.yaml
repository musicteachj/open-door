  asker: Marcus Bell, salaried, works at the Oakland store in Oakland, CA
  location_asked:
  question: whats the eap and does my boss find out if i use it
  reference: |-
    The EAP offers free, confidential short-term counseling, up to 6 sessions per issue each year. Juniper Row never learns who uses it.
  answer: |-
    **What the EAP is:** The Juniper Row Employee Assistance Program (EAP) offers free and confidential short-term counseling for employees and the members of their households. It is run by an outside counseling service, separate from Juniper Row.[1] It provides up to 6 sessions per issue each year, at no cost to you or your household members. Sessions can be by phone or video, depending on the counselor.[2] Counseling is available at any hour.[3]

    You can use it for stress, anxiety, grief, relationship or family concerns, money worries, substance use, or any other concern that is weighing on you. You do not need to be in crisis, and you do not need to explain your reasons to anyone at work.[4]

    **Will your boss find out:** No. Your use of the EAP is confidential. Juniper Row never learns who uses it. The counseling service reports only combined numbers to Juniper Row, and never names or details.[5] That means neither your manager nor anyone else at the company finds out.

    **Next step:** I didn't find the EAP's phone number or how to sign up in these passages. The HR team can give you that, and their contact details are in the directory. You don't have to tell them why you're asking.
