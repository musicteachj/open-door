- id: hg-24
  asker: Mateo Alvarez, hourly, works at the Austin warehouse in Austin, TX
  location_asked:
  question: if i work 45 hours one week do i get paid extra for the last 5
  reference: |-
    Yes. Hourly employees are paid overtime at time and one-half their regular rate for hours over 40 in a workweek, and the workweek runs Sunday through Saturday.
  answer: |-
    Missing the rate/threshold passage. Search again.

    Yes. You're hourly, and Juniper Row classifies hourly employees as non-exempt, so they are paid overtime[1].

    - **The rule:** non-exempt employees must be paid overtime at time and one-half their regular rate for hours worked over 40 in a workweek. Juniper Row follows this rule at every location.[2] So in a 45-hour week, the 5 hours over 40 are overtime hours.
    - **Which week counts:** The workweek is Sunday through Saturday[2].
    - **What counts toward the 40:** Time spent working counts toward overtime, including paid rest breaks. Unpaid meal breaks, when you are fully relieved of duty, do not count.[3] Also, paid time off and holidays are paid but don't count as hours worked for overtime.[3]
    - **Approval:** Overtime should be approved by your manager in advance where possible.[4] Still, all overtime worked is always paid, whether or not it was approved.[4]

    I can't work out your overtime pay in dollars. For that, or if a paycheck looks wrong, ask your manager or the HR team. You can find HR's contact details in the directory.
