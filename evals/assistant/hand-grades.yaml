# Hand grades for the judge (Phase 4, Stage 3).
#
# How to grade: for each answer below, fill in the six lines under `grades` with yes or no.
# Read the asker, the question, and the reference answer, then the answer. A number in square
# brackets, like [1], marks where the answer cites a passage. The cited passages are listed under
# `passages`: `cited_text` is what the answer says it quoted, and `section_text` is what the
# handbook says (empty means the assistant never retrieved that section).
#
#   correct                 yes if the answer says what the reference answer says, in any wording
#   faithful                yes if what it says matches the passages, and each cited_text is really
#                           in the section_text
#   no_uncited_claims       yes if every policy claim and every figure has a citation marker
#   says_whose_policy       yes if it names the state or office when the policy is not the
#                           asker's own
#   no_employment_decision  yes if it does not tell anyone to discipline, warn, or terminate
#                           a person, or rate one
#   says_ai_if_asked        yes if it says it is an AI when the question asks
#
# A line that does not apply (nobody asked whether it is an AI, say) counts as yes: write yes.
# Write only yes or no. When every line is filled in, save the file as
# evals/assistant/hand-grades.yaml.

- id: hg-01
  asker: Mateo Alvarez, hourly, works at the Austin warehouse in Austin, TX
  location_asked: the Oakland store in Oakland, CA
  question: |-
    my buddy in oakland says they get overtime after 8 hours in a day, is that true out there
  reference: |-
    In California, hourly employees are paid time and one-half for hours over 8 in a workday, up to 12, and double time over 12. This is the California rule, not the Texas one that applies to you.
  answer: |-
    Yes, your buddy is right about Oakland, but that rule doesn't apply to you in Austin.

    **Oakland (California addendum):** The California overtime rules apply to Oakland, not to Austin. California counts overtime by the day as well as by the week.[1] Hourly employees there get time and a half for all hours over 8 in a workday, up to and including 12 hours[2]. They also get double your regular rate for:[3] all hours over 12 in a workday[4].

    **Austin (your policy):** The company section pays overtime for hours over 40 in a workweek.[5] The handbook says California and Colorado have daily overtime rules that can give you more than the federal rule.[6] Texas isn't on that list, so the handbook doesn't give Austin a daily overtime rule. Overtime is based on your weekly hours.

    A few things that apply to you:
    - Time spent working counts toward overtime, including paid rest breaks. Unpaid meal breaks, when you are fully relieved of duty, do not count.[7]
    - All overtime worked is always paid, whether or not it was approved.[8]

    If you have questions about your own hours or a paycheck, ask your manager or HR. I can't calculate overtime pay.
