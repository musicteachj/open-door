- id: hg-04
  asker: Priya Raman, salaried, works at the Oakland store in Oakland, CA
  location_asked:
  question: |-
    im giving my notice at the end of the month. when do i get my last paycheck and does my leftover pto get paid
  reference: |-
    In California, if you give at least 72 hours' notice and leave on the day you named, all your wages are due on your last day. Your final pay includes any unused PTO.
  answer: |-
    Since you work in Oakland, the California rules apply to you.

    **Last paycheck:** Under California's rules, if you quit, give at least 72 hours' notice, and leave on the day you named, all your wages are due on your last day. If you quit without 72 hours' notice, all your wages are due within 72 hours.[1] Those deadlines come before the company's usual "next regular payday" rule, so they are the ones that apply to you.[2] Telling them now about an end-of-month departure is well over 72 hours' notice.

    **Leftover PTO:** Yes, it gets paid out. Your final wages include all of your unused paid time off. California treats PTO the same as vacation, so it is earned wages and is paid out whatever the reason you leave.[3] Unused sick leave is a separate benefit and is not paid out.[4]

    **What to do next:**
    - Tell your manager and HR as early as you can.[5] HR prepares your final wages ahead of time when it knows the date.[5]
    - Return company property and confirm where to send your final pay statement. HR sends you a summary of your final pay and your paid time off payout.[6]

    I can't work out your PTO balance or the payout amount. HR can give you those numbers.
