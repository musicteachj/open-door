- id: hg-32
  asker: Dana Whitfield, salaried, works at the Denver HQ in Denver, CO
  location_asked:
  question: |-
    i might need a few months off for a health thing. can i keep my job and does my insurance stop
  reference: |-
    Juniper Row offers up to 12 weeks of unpaid, job-protected leave after 12 months and 1,250 hours worked, and your health coverage continues. Colorado's FAMLI program can also pay part of your wages for up to 12 weeks.
  answer: |-
    For job protection and insurance, the handbook mostly says yes, depending on how long you've worked here.

    **Keeping your job**
    - **Company leave:** You can take up to 12 weeks of unpaid, job-protected leave in a 12-month period if you have worked at Juniper Row for 12 months and for 1,250 hours in the 12 months before the leave begins.[1] This leave is a company benefit and does not carry federal FMLA protections.[1]
    - **Colorado addendum:** If you have been employed at Juniper Row for at least 180 calendar days before your leave starts, you return to your job or an equivalent position with equivalent pay and benefits.[2] Also, when the reason qualifies for both, FAMLI leave and Juniper Row's own leave in §5.1 Family and medical leave run at the same time.[3]
    - Retaliation and interference are prohibited.[2]

    **Insurance**
    Your health coverage continues during leave on the same terms as when you were working.[4]

    **Pay**
    Leave under this section is unpaid, but you may use PTO or sick leave to be paid during it.[4]

    You mentioned "a few months." I can't work out whether you qualify or how much of that time would be covered. The HR team can confirm that with you.

    **Privacy when you talk to HR**
    You can open a confidential case in Open Door. You do not have to tell your manager first.[5] Only the HR team sees a case. Managers never see a case, including your own manager. Coworkers do not see it either. HR shares details only with the people who must be involved to look into the matter, and tells you first if that is needed.[6] Medical information, accommodation requests, and confidential cases are held separately and shared only with the people who need them.[7]

    **What to do next:** Since you work in HR yourself, you may want to ask for a teammate you're comfortable with when you open the case. The HR contacts are listed below.
