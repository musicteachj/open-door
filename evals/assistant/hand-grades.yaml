  location_asked:
  question: if i work 45 hours one week do i get paid extra for the last 5
  reference: |-
    Yes. Hourly employees are paid overtime at time and one-half their regular rate for hours over 40 in a workweek, and the workweek runs Sunday through Saturday.
  answer: |-
    Missing the threshold/rate passage (p2). Search again.

    Yes. As an hourly employee, you get overtime pay for hours over 40 in a week.

    **What the handbook says**
    - Juniper Row classifies hourly employees as non-exempt, so they are paid overtime[1].
    - Non-exempt employees must be paid overtime at time and one-half their regular rate for hours worked over 40 in a workweek. Juniper Row follows this rule at every location. The workweek is Sunday through Saturday[2].
    - Not every paid hour counts toward the 40. Time spent working counts toward overtime, including paid rest breaks. Unpaid meal breaks, when you are fully relieved of duty, do not count. Under Juniper Row's policy, paid time off and holidays are paid but don't count as hours worked for overtime.[3]
    - Overtime should be approved by your manager in advance where possible.[4] Even so, all overtime worked is always paid, whether or not it was approved.[4]

    So if all 45 hours that week were time worked, the 5 hours past 40 count as overtime.

    **What you can do next**
    I can't work out your actual overtime pay. If you have questions about your paycheck, ask your manager or the HR team. Their contact details are in the directory. If you're planning to work extra hours, check with your manager first.
