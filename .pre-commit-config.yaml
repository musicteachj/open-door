# Fast checks before each commit. CI runs the full set, so these are a head start, not the gate.
# Install once with `make setup`, which installs pre-commit itself with `uv tool install` (so the
# git hook points at a durable tool, not uvx's cache) and then runs `pre-commit install`. Run by
# hand with `pre-commit run --all-files`.
# The gitleaks `rev` below must equal the Makefile's GITLEAKS and the Security workflow's
# GITLEAKS_VERSION: `make check-workflows` fails when they differ.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: web-lint
        name: web lint (oxlint)
        entry: npm --prefix apps/web run lint
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: web-format
        name: web format check (prettier)
        entry: npm --prefix apps/web run format:check
        language: system
        files: ^apps/web/
        pass_filenames: false
