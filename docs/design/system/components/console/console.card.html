<!-- @dsCard group="Components" viewport="1180x3200" name="AI Ops console" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script><script src="../../preview/loader.js"></script></head><body style="margin:0;background:var(--surface-raised)"><div id="root" style="max-width:1180px"></div>
<script type="text/babel" data-presets="react">
loadOpenDoor("../../", OD_FILES).then(function (OD) {
  const { ConsoleTile, TurnTable, TracePanel, Scoreboard, ScoreboardSetRow, StatusBadge, SafetyLabel, InjectionTag } = OD;
  const Lbl = ({ children }) => <div style={{ font: "400 11px/16px var(--font-sans)", color: "var(--ink-muted)", marginBottom: 8 }}>{children}</div>;
  const H = ({ children }) => <h2 style={{ margin: "0 0 12px", font: "600 15px/24px var(--font-sans)", color: "var(--ink)" }}>{children}</h2>;
  const Cell = ({ label, children }) => <div style={{ display: 'flex', flexDirection: 'column' }}><Lbl>{label}</Lbl><div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>{children}</div></div>;
  const MODEL = { id: 'claude-opus-5-5', effort: 'low', prompt: '2026-11.2', tools: '2026-11.2' };
  const rows = [
    { id: 'r1', time: '10:31 AM', asker: 'Employee', location: 'Oakland, CA', tools: '1', cited: 'CA-4.3', cost: '$0.021', firstToken: '1.4 s' },
    { id: 'r2', time: '10:33 AM', asker: 'Employee', location: 'Oakland, CA', offeredCard: true, tools: '2', cited: '4.1', cost: '$0.028', firstToken: '2.2 s', state: 'hover' },
    { id: 'r3', time: '10:38 AM', asker: 'Employee', location: 'Oakland, CA', injection: true, tools: '0', cost: '$0.011', firstToken: '1.1 s', state: 'focus' }
  ];
  const outcomes = ['answered', 'not-covered', 'refused', 'stopped', 'failed', 'cap', 'safety-unavailable'];
  function Card() {
    return (
      <div style={{ padding: "20px 24px 40px", display: "flex", flexDirection: "column", gap: 40, fontFamily: 'var(--font-sans)' }}>
        <div><H>ConsoleTile</H>
          <div className="od-tiles" style={{ gridTemplateColumns: 'repeat(4, minmax(0, 1fr))' }}>
            <Cell label="Normal"><ConsoleTile id="c1" title="Cards confirmed by a person" rows={[['Time-off requests', '1'], ['Decisions', '1'], ['Cancellations', '0']]} foot="From the audit log" /></Cell>
            <Cell label="Small sample"><ConsoleTile id="c2" title="Time to first token" pre="Median" figure="1.6 s" lines={['95th percentile 2.2 s', 'Target 3 s']} foot="9 turns · Small sample" /></Cell>
            <Cell label="Above target (neutral, same ink)"><ConsoleTile id="c3" title="Safety check time" pre="95th percentile" figure="980 ms" lines={['Target 800 ms']} foot="9 turns · Small sample" /></Cell>
            <Cell label="No turns yet"><ConsoleTile id="c4" title="Cost per answered question" state="empty" spend="Sandbox spend $0.00 of $1.00 cap" /></Cell>
            <Cell label="Tile 6, filled"><ConsoleTile id="c5" title="Said the handbook doesn’t cover it" figure="2" lines={['of 31 turns']} closest={['4.1 Paid time off (2)', '5.2 Parental leave (1)']} /></Cell>
            <Cell label="Tile 6, none yet"><ConsoleTile id="c6" title="Said the handbook doesn’t cover it" figure="0" lines={['of 9 turns']} closest={[]} foot="Small sample" /></Cell>
            <Cell label="Loading"><ConsoleTile id="c7" title="Escalation rate" state="loading" /></Cell>
          </div>
        </div>
        <div><H>Outcome badges</H><div style={{ display: 'flex', flexWrap: 'wrap', gap: 12 }}>{outcomes.map((o) => <StatusBadge key={o} status={'outcome-' + o} />)}</div>
          <p style={{ margin: '10px 0 0', font: '400 13px/20px var(--font-sans)', color: 'var(--ink-muted)' }}>Ink-muted icons; only Failed, an error, uses the danger icon. The label always carries the meaning.</p></div>
        <div><H>Safety check labels</H><div style={{ display: 'flex', gap: 32, alignItems: 'flex-start' }}><SafetyLabel /><SafetyLabel injection /><Cell label="Stacked beside a docked panel"><InjectionTag stacked /></Cell></div></div>
        <div><H>TurnTable rows</H><Lbl>Default, hover, keyboard focus, then the flagged row (plain text, not focusable, no trace).</Lbl>
          <TurnTable id="ct" heading="Monday, October 26 · 9 turns" rows={rows} flagged={{ facts: 'Oct 26 · 14,800 input tokens · 550 output · $0.024 · safety check 760 ms · first token 1.9 s · total 5.2 s' }} />
          <div style={{ marginTop: 24 }}><Lbl>Loading</Lbl><TurnTable id="cl" loading /></div>
        </div>
        <div><H>TracePanel variants</H>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 360px)', gap: 24, alignItems: 'start' }}>
            <Cell label="Refused by the model"><div style={{ height: 1230, '--panel-width': '360px', border: '1px solid var(--border)', borderRadius: 12, overflow: 'hidden' }}>
              <TracePanel id="tv1" title="9:14 AM · Employee · Austin, TX" outcome="refused" category="general harms" safety={{ ms: '610 ms' }} tools={[]} sections={[]} model={MODEL}
                tokens={{ input: '6,200', cached: '5,100', output: '0', cacheWrites: '0' }} cost="$0.006" timings={{ safety: '610 ms', firstToken: 'No answer text', total: '1.3 s' }} /></div></Cell>
            <Cell label="Fallback"><div style={{ height: 1230, '--panel-width': '360px', border: '1px solid var(--border)', borderRadius: 12, overflow: 'hidden' }}>
              <TracePanel id="tv2" title="10:02 AM · Manager · Oakland, CA" safety={{ ms: '660 ms' }} tools={[{ label: 'Searched the handbook', name: 'search_handbook', ms: '410 ms' }]}
                sections={[{ num: '4.1', title: 'Paid time off', cited: true }]} model={{ ...MODEL, fallback: 'claude-sonnet-5-5' }}
                tokens={{ input: '12,900', cached: '10,400', output: '480', cacheWrites: '0' }} cost="$0.011" timings={{ safety: '660 ms', firstToken: '3.1 s', total: '6.2 s' }} /></div></Cell>
            <Cell label="A tool that failed"><div style={{ height: 1230, '--panel-width': '360px', border: '1px solid var(--border)', borderRadius: 12, overflow: 'hidden' }}>
              <TracePanel id="tv3" title="9:48 AM · Employee · Oakland, CA" outcome="failed" safety={{ ms: '650 ms' }} tools={[{ label: 'Checked time off', name: 'check_time_off', ms: '3.0 s', status: 'failed' }]} sections={[]} model={MODEL}
                tokens={{ input: '9,100', cached: '8,200', output: '0', cacheWrites: '0' }} cost="$0.006" timings={{ safety: '650 ms', firstToken: 'No answer text', total: '3.8 s' }} /></div></Cell>
          </div>
        </div>
        <div><H>Scoreboard set rows</H><Lbl>With figures, and the placeholder</Lbl>
          <div className="od-sb"><div className="od-sb__wrap" style={{ marginTop: 0 }}><table className="od-sb__sets"><colgroup><col style={{ width: '22%' }} /><col style={{ width: '20%' }} /><col style={{ width: '16%' }} /><col style={{ width: '42%' }} /></colgroup>
            <thead><tr><th scope="col">Set</th><th scope="col">Result</th><th scope="col">Lowest trial</th><th scope="col">Other figures</th></tr></thead>
            <tbody><ScoreboardSetRow set={{ name: 'Answer quality', src: 'Oct 29', fig: '68%', cap: 'Judge pass rate', low: '65%', other: ['Target 85%', '18 uncited claims', 'Judge agreement with the hand grades 89.7%'] }} /><ScoreboardSetRow set={{ name: 'Fairness', placeholder: 'New in Phase 7. Not measured yet.' }} /></tbody></table></div></div>
        </div>
        <div><H>Scoreboard (whole)</H><Scoreboard id="csb" /></div>
      </div>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
});
</script></body></html>
