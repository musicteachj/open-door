<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;background:#FFFFFF;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#59256A}a:hover{color:#461B54}</style>
</helmet>
<div style="box-sizing:border-box;height:{{ shellH }};min-height:{{ shellMin }};padding:{{ shellPad }};background:{{ shellBg }}"><div style="box-sizing:border-box;height:{{ cardH }};width:{{ cardW }};max-width:100%;border:{{ cardBd }};border-radius:{{ cardR }};overflow:hidden;background:var(--surface-raised)">
<aside aria-label="Handbook passage" aria-busy="{{ busy }}" style="height:100%;min-height:0;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface-raised);font-family:var(--font-sans);color:var(--ink)">
  <header style="flex:none;display:flex;flex-direction:column;gap:6px;padding:14px 14px 18px 24px;border-bottom:1px solid var(--border-subtle)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:13px;line-height:20px;color:var(--ink-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>{{ eyebrow }}</span>
      <button type="button" aria-label="Close passage" onClick="{{ close }}" style="width:32px;height:32px;flex:none;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--neutral-hover);color:var(--ink)" style-focus="outline:2px solid var(--focus-ring);outline-offset:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>
    <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
      <h2 style="margin:0;font-size:var(--text-h2);line-height:var(--leading-h2);font-weight:600">{{ title }}</h2>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:4px">
        <span style="display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);font-size:13px;line-height:20px;white-space:nowrap"><span style="color:var(--ink-muted)">Applies to:</span><span style="font-weight:600">{{ applies }}</span></span>
        <sc-if value="{{ yes }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:20px;white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><path d="M20 6 9 17l-5-5"></path></svg>Applies to you</span></sc-if>
        <sc-if value="{{ no }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:20px;color:var(--ink-muted);white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg>Doesn't apply to you</span></sc-if>
        <span style="font-size:13px;line-height:20px;color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap">Last updated {{ updated }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
      <span aria-hidden="true" style="display:block;width:160px;height:20px;margin:4px 0;border-radius:6px;background:var(--surface-hover)"></span>
      <span aria-hidden="true" style="display:block;width:260px;height:12px;margin-top:8px;border-radius:6px;background:var(--surface-hover)"></span>
    </sc-if>
  </header>
  <div tabindex="0" aria-label="Passage text" style="flex:1;min-height:0;overflow:auto;padding:20px 24px 24px;outline:0" style-focus="box-shadow:inset 0 0 0 2px var(--focus-ring)">
    <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ hasBefore }}" hint-placeholder-val="{{ true }}"><p style="margin:0 0 16px;font-size:15px;line-height:24px;color:var(--ink-muted);text-wrap:pretty">{{ before }}</p></sc-if>
      <div role="region" aria-labelledby="pp-cited" style="position:relative;margin:0 -12px 16px;padding:10px 12px 14px;background:var(--primary-tint);border-radius:var(--radius-md)"><span aria-hidden="true" style="position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--marker)"></span>
        <span id="pp-cited" style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px;line-height:20px;font-weight:600;color:var(--ink)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path></svg>Cited passage</span>
        <p style="margin:0;font-size:15px;line-height:24px;color:var(--ink);text-wrap:pretty">{{ cited }}</p>
      </div>
      <sc-if value="{{ hasAfter }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:15px;line-height:24px;color:var(--ink-muted);text-wrap:pretty">{{ after }}</p></sc-if>
    </sc-if>
    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="display:flex;flex-direction:column;gap:12px">
        <span style="display:block;width:100%;height:12px;border-radius:6px;background:var(--surface-hover)"></span>
        <span style="display:block;width:92%;height:12px;border-radius:6px;background:var(--surface-hover)"></span>
        <span style="display:block;width:64%;height:12px;border-radius:6px;background:var(--surface-hover)"></span>
        <span style="display:block;width:100%;height:96px;margin-top:12px;border-radius:var(--radius-md);background:var(--surface-hover)"></span>
        <span style="display:block;width:88%;height:12px;margin-top:12px;border-radius:6px;background:var(--surface-hover)"></span>
        <span style="display:block;width:72%;height:12px;border-radius:6px;background:var(--surface-hover)"></span>
      </div>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading passage</span>
    </sc-if>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display:flex;align-items:center;gap:12px">
        <p style="flex:1;display:flex;align-items:center;gap:8px;margin:0;font-size:var(--text-ui);line-height:20px;color:var(--danger)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>Couldn't load this passage.</p>
        <button type="button" onClick="{{ retry }}" style="height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font-family:var(--font-sans);font-size:13px;line-height:20px;font-weight:600;cursor:pointer" style-hover="background:var(--surface-hover);border-color:var(--border-strong-hover)" style-focus="outline:2px solid var(--focus-ring);outline-offset:2px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>Retry</button>
      </div>
    </sc-if>
  </div>
  <footer style="flex:none;display:flex;padding:12px 24px;border-top:1px solid var(--border-subtle)">
    <a href="{{ href }}" onClick="{{ open }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 16px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink);font-family:var(--font-sans);font-size:var(--text-ui);line-height:20px;font-weight:600;text-decoration:none" style-hover="background:var(--surface-hover);border-color:var(--border-strong-hover);color:var(--ink)" style-focus="outline:2px solid var(--focus-ring);outline-offset:2px">Open in handbook<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a>
  </footer>
</aside>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:640},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;'open' | 'loading' | 'error'&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Handbook CA-4.3 · California addendum&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;description&quot;:&quot;Matches the section page eyebrow: \&quot;Handbook CA-4.3 · California addendum\&quot; for addenda (no §), \&quot;Handbook §4.3 · Time off\&quot; for company sections.&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sick leave&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;applies&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;California employees&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;marker&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;yes&quot;,&quot;no&quot;,&quot;&quot;],&quot;default&quot;:&quot;yes&quot;,&quot;tsType&quot;:&quot;'yes' | 'no' | ''&quot;},&quot;updated&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sep 12, 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;before&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;California employees receive 40 hours (5 days) of paid sick leave at the start of each calendar year. Unused sick leave does not carry over, and it is not paid out when employment ends.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cited&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;You can use sick leave for your own illness, injury, or preventive care, or to care for a family member. You do not need to give a reason beyond that the time is sick leave.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;after&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;If you know about the need ahead of time, such as a scheduled appointment, tell your manager in advance. Otherwise, tell them as soon as you can.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/handbook/CA-4.3?passage=p2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&amp;gt; void&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&amp;gt; void&quot;},&quot;onRetry&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&amp;gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, st = p.state || 'open';
    const D = {
      eyebrow: 'Handbook CA-4.3 · California addendum', title: 'Sick leave', applies: 'California employees', updated: 'Sep 12, 2026',
      before: 'California employees receive 40 hours (5 days) of paid sick leave at the start of each calendar year. Unused sick leave does not carry over, and it is not paid out when employment ends.',
      cited: 'You can use sick leave for your own illness, injury, or preventive care, or to care for a family member. You do not need to give a reason beyond that the time is sick leave.',
      after: 'If you know about the need ahead of time, such as a scheduled appointment, tell your manager in advance. Otherwise, tell them as soon as you can.',
      href: '/handbook/CA-4.3?passage=p2'
    };
    const v = k => (p[k] ?? D[k]);
    const path = decodeURIComponent((typeof location !== 'undefined' && location.pathname) || '');
    const solo = /Passage Panel\.dc\.html$/.test(path);
    const marker = p.marker == null ? 'yes' : p.marker;
    return {
      shellH: solo ? 'auto' : '100%', shellMin: solo ? '100vh' : '0', shellPad: solo ? '40px' : '0', shellBg: solo ? '#ECEEEF' : 'transparent',
      cardH: solo ? '640px' : '100%', cardW: solo ? '420px' : '100%', cardBd: solo ? '1px solid var(--border)' : '0', cardR: solo ? '16px' : '0',
      isOpen: st === 'open', isLoading: st === 'loading', isError: st === 'error', busy: st === 'loading' ? 'true' : 'false',
      eyebrow: v('eyebrow'), title: v('title'), applies: v('applies'), updated: v('updated'),
      yes: marker === 'yes', no: marker === 'no',
      before: v('before'), after: v('after'), hasBefore: !!v('before'), hasAfter: !!v('after'), cited: v('cited'), href: v('href'),
      close: () => { if (p.onClose) p.onClose(); },
      open: (e) => { if (p.onOpen) { e.preventDefault(); p.onOpen(); } },
      retry: () => { if (p.onRetry) p.onRetry(); }
    };
  }
}
</script>
</body>
</html>
