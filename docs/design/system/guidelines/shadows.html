<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:20px 24px;background:var(--surface-raised)"><div style="background:var(--surface);margin:-20px -24px;padding:20px 24px"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:3px"><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:none;margin-bottom:10px"></div><div style="font:600 12px/16px var(--font-sans)">shadow-none</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">Default; edges come from borders</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:var(--shadow-xs);margin-bottom:10px"></div><div style="font:600 12px/16px var(--font-sans)">shadow-xs</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">Composer at rest</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:var(--shadow-md);margin-bottom:10px"></div><div style="font:600 12px/16px var(--font-sans)">shadow-md</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">Tooltip, popover, menu</div></div><div style="display:flex;flex-direction:column;gap:3px"><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--focus-ring);box-shadow:var(--shadow-focus-halo);margin-bottom:10px"></div><div style="font:600 12px/16px var(--font-sans)">shadow-focus-halo</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">Composer
