<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:20px 24px;background:var(--surface-raised)"><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);margin-bottom:6px"></div><div style="font:600 12px/16px var(--font-sans)">surface</div><div style="font:400 11px/14px var(--font-mono);color:var(--ink-muted)">#F5F7F8</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">App background</div></div><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border);margin-bottom:6px"></div><div style="font:600 12px/16px var(--font-sans)">surface-raised</div><div style="font:400 11px/14px var(--font-mono);color:var(--ink-muted)">#FFFFFF</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">Sheet, composer</div></div><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-sunken);border:1px solid var(--border);margin-bottom:6px"></div><div style="font:600 12px/16px var(--font-sans)">surface-sunken</div><div style="font:400 11px/14px var(--font-mono);color:var(--ink-muted)">#F9FAFB</div><div style="font:400 11px/14px var(--font-sans);color:var(--ink-muted)">Right rail</div></div><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:var(--surface-hover);border:1px solid var(--border);margin-bottom:6px"></div><div style="font:600 12px/16px var(--font-sans)">surface-hover</div><div style="font:400 11px/14
