# Weekly, grouped dependency updates, opened against dev like every other change. They carry
# skip-changelog: a version bump is a chore, and the lockfile diff is its own record.
# The 7-day cooldown waits for a release to age before proposing it, so a compromised release has
# time to be caught first. Security updates skip the wait.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, skip-changelog]
