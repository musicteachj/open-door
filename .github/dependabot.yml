# Monthly, grouped dependency updates, opened against dev like every other change. They carry
# skip-changelog: a version bump is a chore, and the lockfile diff is its own record.
# Only patch and minor updates are proposed. A major version is a decision, made by hand in its
# own pull request. For example, @types/node moves with the Node version in .nvmrc, and TypeScript
# moves when the Vite template does.
# The 7-day cooldown waits for a release to age before proposing it, so a compromised release has
# time to be caught first. Security updates skip the wait.
# Only what ships or builds the app is watched. The proxy check's nginx image
# (scripts/proxy-check/compose.yaml) and the pre-commit hooks (.pre-commit-config.yaml) are updated
# by hand, the owner's choice of 2026-11-11 for fewer pull requests: ruff's hook moves with ruff in
# apps/api/uv.lock, and gitleaks' with the Makefile and the Security workflow
# (`make check-workflows` fails if they differ).
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # ruff moves by hand, in the lockfile and the pre-commit hook together: a bump of one alone
      # fails `make check-workflows`. (Its security updates are by hand too; it is a dev-only linter.)
      - dependency-name: ruff
    groups:
      python:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      web:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  # The production image's base images (the Dockerfile), pinned by tag and digest, which Dependabot
  # updates.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ['*']
    labels: [dependencies, skip-changelog]
