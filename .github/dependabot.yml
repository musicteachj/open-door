# Monthly, grouped dependency updates, opened against dev like every other change. They carry
# skip-changelog: a version bump is a chore, and the lockfile diff is its own record.
# Only patch and minor updates are proposed. A major version is a decision, made by hand in its
# own pull request. For example, @types/node moves with the Node version in .nvmrc, and TypeScript
# moves when the Vite template does.
# The 7-day cooldown waits for a release to age before proposing it, so a compromised release has
# time to be caught first. Security updates skip the wait.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      python:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      web:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  # The production image's base images (the Dockerfile) and, for the proxy check, the nginx image
  # (scripts/proxy-check/compose.yaml). Both are pinned by digest, which Dependabot updates.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  - package-ecosystem: docker-compose
    directory: /scripts/proxy-check
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      docker-compose:
        patterns: ['*']
    labels: [dependencies, skip-changelog]

  # The hooks in .pre-commit-config.yaml (ruff, gitleaks). gitleaks' `rev` must move with the
  # Makefile and the Security workflow: `make check-workflows` fails if only one does.
  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      pre-commit:
        patterns: ['*']
    labels: [dependencies, skip-changelog]
