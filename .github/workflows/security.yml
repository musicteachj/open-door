name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  # Weekly, so a newly published vulnerability in an unchanged dependency still surfaces.
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

# Runs for a pull request share a group, so a newer push cancels the older run. Each push to dev
# or main gets its own group, its commit, so no merge's run is ever canceled or left waiting.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1

  python-dependencies:
    name: Vulnerable Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # Audits exactly what uv.lock pins, with hashes, and nothing else: no virtual environment, and
      # no pip-audit dependencies mixed in. --no-emit-project leaves out the API itself, which isn't
      # a published package. The version is pinned by hand, as the Makefile's PIP_AUDIT is.
      # `shell: bash` turns on pipefail, so a failed export fails the step instead of auditing an
      # empty list (pip-audit passes on no input).
      - name: Audit the locked dependencies
        shell: bash
        run: uv export --locked --no-emit-project | uvx pip-audit@2.10.1 -r /dev/stdin --no-deps --disable-pip

  web-dependencies:
    name: Vulnerable web dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # npm audit reads package-lock.json, so no install is needed.
      - run: npm audit --audit-level=high
