# Every action is pinned to a full commit SHA, with its version in a comment. Dependabot updates
# both, and `make check-workflows` (zizmor) fails on an action pinned only to a tag.
name: CI

on:
  # dev is where work lands; main is the release branch. A push to either must be checked.
  push:
    branches: [main, dev]
  # No branch filter: every pull request is checked, including feature -> dev.
  pull_request:
  workflow_dispatch:

# Runs for a pull request share a group, so a newer push cancels the older run. Each push to dev
# or main gets its own group, its commit, so no merge's run is ever canceled or left waiting.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # Every other checkout drops its credentials. This one keeps them, because on a push
      # paths-filter fetches the previous commit with them. The job runs no repository code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      # Docs-only changes skip the heavy jobs. That saves private-repo Actions minutes. The
      # exceptions are docs the tests read: docs/design/ runs the Web job, and handbook/ runs the
      # API and E2E jobs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # On a push, compare with the commit before the push. Left unset, a push to main would be
          # compared with dev, the default branch, and a release merge would skip the API and Web jobs.
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/web/openapi.json'
              # The generated scoreboard is checked against the boards in evals/scoreboards/.
              - 'README.md'
              - 'apps/web/src/generated/**'
              - 'evals/**'
              - 'handbook/**'
              # The scripts the API's tests import or read (the image check's judgment, the proxy
              # check's, and the entrypoint).
              - 'scripts/**'
              - 'compose.yaml'
              # The eval runner's tests read the eval-live target and the fixtures' ignore rule.
              - 'Makefile'
              - '.gitignore'
              # The cost-report tests read the rules the evals follow, and the spec that sets them.
              - 'CLAUDE.md'
              - 'docs/specs/2026-10-31-phase-7-ai-ops-reviewer-model.md'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              # The files outside apps/web that the unit tests (Vitest) read: the design tokens and
              # screens, the personal-data cases shared with the evals, and the seeded personas.
              - 'docs/design/**'
              - 'evals/assistant/personal-data-cases.json'
              - 'apps/api/app/modules/sandbox/seed_data.py'
              - '.nvmrc'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            e2e:
              - 'apps/web/**'
              - 'apps/api/**'
              # The API the browser tests run against loads the handbook from here.
              - 'handbook/**'
              # The image they run against is built from these, and the proxy check runs it.
              - 'Dockerfile'
              - '.dockerignore'
              - 'scripts/image/**'
              - 'scripts/proxy-check/**'
              - 'Makefile'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The test suite alone takes 11 to 14 minutes on a hosted runner (2026-11-02), so 15 left no
    # room. A hang still stops well before the 6-hour default.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      # The same image and credentials as compose.yaml, so CI tests what developers run.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: opendoor
          POSTGRES_PASSWORD: opendoor
          POSTGRES_DB: opendoor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U opendoor -d opendoor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The same throwaway credentials as apps/api/.env.example. The tests connect as the API's own
    # login, which the bootstrap step creates; migrations and the bootstrap run as the owner.
    env:
      APP_ENV: test
      # The fixed, obviously fake test key (32 zero bytes). The API refuses it unless APP_ENV=test.
      ENCRYPTION_KEYRING: test:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql+asyncpg://od_app_login:od_app_dev@127.0.0.1:5433/opendoor
      MIGRATION_DATABASE_URL: postgresql+asyncpg://opendoor:opendoor@127.0.0.1:5433/opendoor
      CLEANUP_DATABASE_URL: postgresql+asyncpg://od_cleanup_login:od_cleanup_dev@127.0.0.1:5433/opendoor
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # --locked fails if uv.lock is out of date with pyproject.toml instead of quietly updating it.
      - run: uv sync --locked
      # ../../evals holds the retrieval eval's runner and ../../scripts the image, proxy check, and
      # CI scripts; --config gives them the API's lint rules.
      - run: uv run ruff check . ../../evals ../../scripts --config pyproject.toml
      - run: uv run ruff format --check . ../../evals ../../scripts --config pyproject.toml
      - run: uv run mypy
      - name: Domain and policy code import no framework
        run: uv run lint-imports
      - name: Migrate as the owner
        run: uv run alembic upgrade head
      # The same sequence as `make migrations-roundtrip`, which the bootstrap and the ingest below
      # complete.
      - name: Every migration reverses cleanly
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Create the login users
        run: uv run python scripts/bootstrap_db_users.py
      # Loads the handbook from the committed embedding cache. The job has no Voyage key, so a
      # chunk with no cached vector fails here: run `make embed` and commit the cache.
      - name: Load the handbook
        run: uv run python scripts/ingest_handbook.py ingest
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Tests, connected as the API's own login
        run: uv run pytest
      # Replays the committed query embeddings: no Voyage key, no network. A question with no cached
      # embedding fails here: run `make embed` and commit the cache.
      - name: Handbook search finds the right sections (retrieval eval)
        run: uv run python ../../evals/retrieval/run.py --check
      # Replays the recorded answers and judge verdicts of the full set: no Anthropic or Voyage
      # key, no network. A request with no recording (a prompt, tool, or retrieval change) fails
      # here: run `make eval-live SET=full YES=1` and commit the fixtures.
      - name: Assistant evals replay the recorded answers (offline)
        run: uv run python ../../evals/assistant/run.py --mode offline --set full --check
      # The guard's escalation set: replayed from its own recording, no key, no network. Until the
      # recording is committed it prints "not recorded yet" and passes. Then a guard prompt change
      # fails here: run `make eval-live SET=escalation YES=1` and commit the fixture.
      - name: The guard routes the escalation set (offline)
        run: uv run python ../../evals/assistant/run.py --mode offline --set escalation --check
      # The case summary set: trial 1's summaries replayed from their own recording, graded by the
      # same checks every live summary passes, no key, no network. Until the recording is committed
      # it prints "not recorded yet" and passes. Then a change to the summary prompt, the checks,
      # or the narratives fails here: run `make eval-live SET=case-summary YES=1` and commit it.
      - name: The case summarizer passes its checks on the set (offline)
        run: uv run python ../../evals/assistant/run.py --mode offline --set case-summary --check
      - name: The committed OpenAPI schema matches the API
        run: uv run python scripts/export_openapi.py --check
      # The README's scoreboard and the console's JSON are generated from the committed run boards.
      # A board that changed without `make scoreboard` fails here.
      - name: The README scoreboard and its JSON match the run boards
        run: uv run python ../../evals/scoreboard_gen.py --check

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The production build leaves out the component gallery
        run: npm run check:no-gallery
      - name: The committed API client matches openapi.json
        run: npm run check:api-client

  # The production image, built once and tested three ways: inspected (`make image-check`), driven
  # by the browser tests (Chromium against the real database, the whole app on one origin with the
  # real Content Security Policy, and every test also failing on a CSP violation), and run behind a
  # strict nginx (`make proxy-check`). The browser tests run against the image, not the Vite
  # preview. The gallery specs need the test variant, so both variants are built. No paid AI calls.
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # About 18 minutes of browser tests on one worker (playwright.config.ts), plus the two image
    # builds (a cold build is several minutes, a cached one about one), the image check, and the
    # proxy check (about two). 45 leaves room for a cold cache and a slow runner.
    timeout-minutes: 45
    services:
      # The same service as the API job.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: opendoor
          POSTGRES_PASSWORD: opendoor
          POSTGRES_DB: opendoor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U opendoor -d opendoor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The API's settings, as in the API job. The launcher (scripts/image/serve.py) passes the
    # container only the ones it needs, and sets its APP_ORIGIN itself.
    env:
      APP_ENV: test
      # The fixed, obviously fake test key (32 zero bytes). The API refuses it unless APP_ENV=test.
      ENCRYPTION_KEYRING: test:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql+asyncpg://od_app_login:od_app_dev@127.0.0.1:5433/opendoor
      MIGRATION_DATABASE_URL: postgresql+asyncpg://opendoor:opendoor@127.0.0.1:5433/opendoor
      CLEANUP_DATABASE_URL: postgresql+asyncpg://od_cleanup_login:od_cleanup_dev@127.0.0.1:5433/opendoor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both variants are loaded into the runner's Docker under the tags the Makefile uses, so the
      # steps below start them without building again (SKIP_BUILD=1). Each has its own cache scope.
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: open-door:prod
          cache-from: type=gha,scope=image-prod
          cache-to: type=gha,scope=image-prod,mode=max
      - name: Build the test image (the production image plus the component gallery)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: open-door:test
          build-args: GALLERY=true
          cache-from: type=gha,scope=image-test
          cache-to: type=gha,scope=image-test,mode=max
      # zizmor flags every cache in this job because build-push-action looks like it publishes
      # artifacts. It does not here: the images are loaded into the runner (load: true), never
      # pushed, and the job has read-only permissions and no secrets. The three ignores below are
      # for that reason, so a poisoned cache could at worst fail this job's own run.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.2 # zizmor: ignore[cache-poisoning]
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
        working-directory: apps/api
      - name: Migrate as the owner
        run: uv run alembic upgrade head
        working-directory: apps/api
      - name: Create the login users
        run: uv run python scripts/bootstrap_db_users.py
        working-directory: apps/api
      # Loads the handbook from the committed embedding cache. The job has no Voyage key, so a
      # chunk with no cached vector fails here: run `make embed` and commit the cache.
      - name: Load the handbook
        run: uv run python scripts/ingest_handbook.py ingest
        working-directory: apps/api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # Non-root, no secrets or tests inside, tzdata, no emSign root, no gallery in the production
      # build, the security headers and the CSP nonce, and the forwarded-address rule.
      - name: Inspect the images
        run: make image-check SKIP_BUILD=1
      # The cache key names the installed Playwright version, so a new version downloads fresh
      # browsers. The system libraries are installed on every run, because they are not cached.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Playwright starts the test image through scripts/image/serve.py (E2E_TARGET=image).
      - name: Browser tests, against the image
        run: npm run e2e
        working-directory: apps/web
        env:
          E2E_TARGET: image
      # The turn stream through a strict nginx (a 20-second read timeout), on Docker and the same
      # database the browser tests used. It starts the test image on :8200 and nginx on :8201,
      # with the scripted model, so no paid AI calls. About two minutes.
      - name: Proxy check
        run: make proxy-check SKIP_BUILD=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Both are cheap, so they run on every pull request, docs-only ones included.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Spelling in American English, links between files, and leftover placeholders
        run: make check-docs

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Also runs scripts/check_tool_versions.py (one gitleaks version in three files) and
      # scripts/check_path_filters.py (every file a test reads is inside its job's filter).
      - name: Workflow mistakes (actionlint, zizmor), tool versions, and path filters
        # The token lets zizmor confirm that each pinned commit really belongs to its action.
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check-workflows
