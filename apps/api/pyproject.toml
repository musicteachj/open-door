[project]
name = "open-door-api"
version = "0.0.0"
description = "The Open Door API: FastAPI, Postgres, and the assistant."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "DTZ", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
# A deprecation warning fails the run, so upgrades surface breakage early.
filterwarnings = ["error"]
markers = ["integration: needs the development Postgres running (make db)"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and policy code import no framework"
type = "forbidden"
# The pure layers: the domain rules (the time-off engine, the holiday calendar) and the policy layer
# that decides who can see what.
source_modules = ["app.domain", "app.policy"]
# Every framework and I/O dependency they must never touch. Add each new one here.
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "uvicorn",
    "httpx",
    "httpx2",
    "pydantic",
    "pydantic_settings",
    "anthropic",
    "pgvector",
    "yaml",
    "app.api",
    "app.core",
    "app.db",
    "app.modules",
]

[[tool.importlinter.contracts]]
name = "Nothing in the API path writes the handbook"
type = "forbidden"
# Only the ingestion script, running as the database owner, may load a handbook version. The API's
# login can't write these tables either, but a stray import should fail here first.
source_modules = ["app.api", "app.main"]
forbidden_modules = ["app.modules.handbook.load"]
include_external_packages = false
