[project]
name = "open-door-api"
version = "0.0.0"
description = "The Open Door API: FastAPI, Postgres, and the assistant."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4",
    "anthropic>=1,<2",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "markdown-it-py>=4.2.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Floors for packages we don't depend on directly. certifi (through httpx) must be 2026.10.19 or
# later, which drops the emSign roots whose intermediate keys were compromised (GHSA-6q48-6c7w-9gw2).
# opentelemetry-api (through FastAPI) must be 1.45.1 or later, which bounds the parsing of the
# `tracestate` header (GHSA-xcq7-p3pf-p88h).
constraint-dependencies = ["certifi>=2026.10.19", "opentelemetry-api>=1.45.1"]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "DTZ", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts", "migrations", "../../evals", "../../scripts/proxy-check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
# A deprecation warning fails the run, so upgrades surface breakage early.
filterwarnings = ["error"]
markers = ["integration: needs the development Postgres running (make db)"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and policy code import no framework"
type = "forbidden"
# The pure layers: the domain rules (the time-off engine, the holiday calendar) and the policy layer
# that decides who can see what.
source_modules = ["app.domain", "app.policy"]
# Every framework and I/O dependency they must never touch. Add each new one here.
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "uvicorn",
    "httpx",
    "httpx2",
    "pydantic",
    "pydantic_settings",
    "anthropic",
    "pgvector",
    "yaml",
    "app.api",
    "app.core",
    "app.db",
    "app.modules",
]

[[tool.importlinter.contracts]]
name = "Nothing in the API path writes the handbook"
type = "forbidden"
# Only the ingestion script, running as the database owner, may load a handbook version. The API's
# login can't write these tables either, but a stray import should fail here first.
source_modules = ["app.api", "app.main"]
forbidden_modules = ["app.modules.handbook.load"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Only the AI package imports the Anthropic SDK"
type = "forbidden"
# Everything that talks to Claude goes through app.ai's transport interface, so the rest of the API
# stays testable with the scripted and replay transports and never depends on the SDK.
# Direct imports only: app.main and the routes must still reach the SDK indirectly, through the
# transport that app.ai builds.
source_modules = ["app.api", "app.core", "app.db", "app.modules", "app.main"]
forbidden_modules = ["anthropic"]
include_external_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inside the AI package, only the Anthropic transport reaches the SDK"
type = "forbidden"
# The interface, the scripted model, and the store must run with no SDK at all, directly or through
# another module: that is what lets the scripted and replay transports stand in for it. A new module
# in app.ai that should stay SDK-free is added here.
source_modules = [
    "app.ai.transport",
    "app.ai.scripted",
    "app.ai.replay",
    "app.ai.pricing",
    "app.ai.budget",
    "app.ai.conversations",
    "app.ai.turn",
]
forbidden_modules = ["anthropic"]
include_external_packages = true
