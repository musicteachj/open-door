# nginx in front of the API for `make proxy-check`. Its own project name, so it never touches the
# development Postgres in the root compose.yaml. The ports (8200 for the API, 8201 for nginx) clash
# with nothing else the project runs (8202 is the buffering control): 8000 and 5173 are `make dev`, 8100 and 4173 the browser tests,
# 5433 Postgres.
name: open-door-proxy-check

services:
  nginx:
    # nginx:1.29-alpine, pinned by tag and digest (Dependabot's update, #109, merged 2026-11-11).
    # Updated by hand from now on: Dependabot no longer watches this test-only image.
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "127.0.0.1:8201:80"
      - "127.0.0.1:8202:81"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Docker Desktop already knows this name; on Linux (CI) the host-gateway entry provides it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
