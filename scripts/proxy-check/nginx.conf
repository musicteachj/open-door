# A deliberately strict reverse proxy, to prove the turn stream survives one. Each setting is one a
# real proxy or load balancer might have. Two servers, one API behind both:
#
#   :80  the pass and heartbeat-control runs. nginx as it is by default: it honors the app's
#        `X-Accel-Buffering: no`, so events pass through as they come.
#   :81  the control. It hides the app's `Content-Encoding: identity`, so nginx compresses the
#        stream, as a proxy that has not been told to leave it alone would. gzip holds every
#        event back until the stream ends, so nothing must arrive in time through it. That proves
#        the pass run's compression and timing assertions can fail.
#
# `proxy_buffering on` is set on both, but it does not by itself hold a small event stream:
# measured with curl against a server that sends one comment a second, nginx 1.27 passes each
# through as it arrives, even with `X-Accel-Buffering` ignored and `postpone_output 65536`. The
# thing that really holds events back in a proxy is compression, hence the second server.

# Shared by both servers.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";

# Shorter than any real load balancer (the AWS one defaults to 60 seconds), so the check is quick.
# The API's 15-second heartbeat must keep a silent stream alive through it.
proxy_read_timeout 20s;

# Compression of the event stream. nginx compresses only the types listed, and its default list is
# just text/html, so without `gzip_types text/event-stream` this check could never see compression.
# `gzip_min_length 1` leaves no size excuse for a small event. Evidence that this makes the check
# live: before the app sent `Content-Encoding: identity`, this same configuration gzipped the
# stream (the pass run saw `Content-Encoding: gzip` and no readable event for 45 seconds, since
# the compressor held everything back). nginx ignores `Cache-Control: no-transform` on a direct
# request, so the app's header, not that one, is what keeps it away.
gzip on;
gzip_types text/event-stream;
gzip_min_length 1;

server {
    listen 80;

    proxy_buffering on;

    location / {
        proxy_pass http://host.docker.internal:8200;
    }
}

server {
    listen 81;

    proxy_buffering on;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_hide_header Content-Encoding;

    location / {
        proxy_pass http://host.docker.internal:8200;
    }
}
