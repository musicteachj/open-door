# Spelling checks for `make check-docs` and CI. US English, as CLAUDE.md requires: "colour" fails.
[default]
locale = "en-us"
# Markdown between `spellchecker:off` and `spellchecker:on` HTML comments is skipped, for text
# that quotes a misspelling on purpose.
extend-ignore-re = ['(?s)<!--\s*spellchecker:off\s*-->.*?<!--\s*spellchecker:on\s*-->']

[default.extend-words]
# axe is the accessibility checker (axe-core), not a misspelling of "ax".
axe = "axe"
# The US locale accepts both spellings. CLAUDE.md asks for one L.
cancelled = "canceled"
cancelling = "canceling"
# The Python package of Mozilla's CA certificates (certifi), named in the changelog.
certifi = "certifi"
# FastAPI's own spelling of its route attribute `route.dependant`.
dependant = "dependant"
# A first name in the directory mockup's sample data.
ines = "ines"
# "ot" is how employees write "overtime" in the retrieval eval's questions.
ot = "ot"

[default.extend-identifiers]
# pydantic-settings' own spelling of the hook a Settings class overrides. Only this identifier is
# allowed; "customise" in prose still fails.
settings_customise_sources = "settings_customise_sources"
# asyncio's own exception name. Only this identifier is allowed; "cancelled" in prose still fails.
CancelledError = "CancelledError"
# anyio's own attribute name on a cancel scope.
cancelled_caught = "cancelled_caught"

[files]
extend-exclude = [
    # Generated files: their spelling comes from their source.
    "uv.lock",
    "package-lock.json",
    "apps/web/openapi.json",
    "apps/web/src/api/generated.ts",
    # Embedding caches: base64 vectors, not words.
    "handbook/embeddings/*.jsonl",
    "evals/retrieval/embeddings/*.jsonl",
    "evals/assistant/fixtures/embeddings.jsonl",
    # Frozen by project rule, so a finding there could never be fixed.
    "docs/plans/2026-09-29-open-door-initial-plan.md",
    # Unicode ranges in @font-face rules, such as U+02BA, are code, not words.
    "docs/design/system/tokens/fonts.css",
    "apps/web/src/styles/fonts.css",
]
